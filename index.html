<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site no GitHub Pages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #24292e;
        }
        p {
            font-size: 1.2rem;
        }
        .btn {
            padding: 10px 20px;
            background-color: #2ea44f;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #22863a;
        }
    </style>
</head>
<body>

    <h1>🚀 Olá, Mundo!</h1>
    <p>Este site está rodando com sucesso no <strong>GitHub Pages</strong>.</p>
    <a href="https://github.com" target="_blank" class="btn">Visitar meu GitHub</a>

</body>
</html>
